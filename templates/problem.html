<!DOCTYPE html>

<html lang="en">
<head>

<title>{{ problem[1] }}</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>

<style>

body{
background:#0f172a;
color:white;
font-family:Segoe UI;
}

.navbar{
background:#1e293b;
}

.problem-box{
background:#1e293b;
padding:20px;
border-radius:10px;
height:80vh;
overflow:auto;
}

.editor-box{
background:#1e293b;
padding:20px;
border-radius:10px;
}

#editor{
height:420px;
border-radius:8px;
}

.terminal{
background:black;
color:#00ff00;
font-family:Consolas,monospace;
padding:15px;
border-radius:8px;
height:200px;
overflow-y:auto;
border:1px solid #333;
margin-top:10px;
}

#output{
white-space:pre-wrap;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark px-4">

<span class="navbar-brand fw-bold">
{{ problem[1] }}
</span>

<a href="/dashboard" class="btn btn-danger btn-sm">
Back
</a>

</nav>

<div class="container-fluid mt-4">

<div class="row g-4">

<div class="col-md-4">

<div class="problem-box">

<h4>📄 Problem</h4>

<hr>

<div style="white-space: pre-wrap;">
{{ problem[2] }}
</div>

</div>

</div>

<div class="col-md-8">

<div class="editor-box">

<div class="d-flex justify-content-between align-items-center mb-3">

<h4>💻 Code Editor</h4>

<select id="language"
class="form-select w-auto"
onchange="changeLanguage()">

<option value="python">Python</option>
<option value="java">Java</option>

</select>

</div>

<div id="editor"></div>

<button class="btn btn-secondary mt-3" onclick="toggleInput()">
Custom Input
</button>

<div id="inputBox" style="display:none;" class="mt-3">

<h6>Input</h6>

<textarea id="stdin"
class="form-control"
style="height:100px;"
placeholder="Example:
2
3"></textarea>

</div>

<div class="mt-3 d-flex gap-2">

<button class="btn btn-warning" onclick="runCode()">▶ Run</button>

<button class="btn btn-info" onclick="executeCode()">⚡ Execute</button>

<button class="btn btn-success" onclick="submitCode()">🚀 Submit</button>

</div>

<h5 class="mt-4">Terminal Output</h5>

<div class="terminal">
<div id="output"></div>
</div>

</div>

</div>

</div>

</div>

<script>

let editor;
let language = "{{ lang }}";

require.config({
paths:{'vs':'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs'}
});

require(['vs/editor/editor.main'], function () {

editor = monaco.editor.create(document.getElementById('editor'), {

value:"",
language:"python",
theme:"vs-dark",
fontSize:14,
minimap:{enabled:false},
automaticLayout:true

});

document.getElementById("language").value = language;

changeLanguage();

});

function changeLanguage(){

language = document.getElementById("language").value;

monaco.editor.setModelLanguage(
editor.getModel(),
language
);

if(language === "python"){
editor.setValue("# Write code here");
}

else if(language === "java"){
editor.setValue("// Write code here");
}



// Clear editor when switching language
editor.setValue("// Write code here");

}

function toggleInput(){

const box=document.getElementById("inputBox");

box.style.display=(box.style.display==="none")?"block":"none";

}

function runCode(){

const code = editor.getValue();
const stdin = document.getElementById("stdin").value;

let terminal = document.getElementById("output");

terminal.innerText = "$ Running...\n\n";

fetch("/run",{

method:"POST",

headers:{
"Content-Type":"application/x-www-form-urlencoded"
},

body:
"code="+encodeURIComponent(code)
+"&stdin="+encodeURIComponent(stdin)
+"&language="+encodeURIComponent(language)
+"&pid={{ problem[0] }}"

})

.then(response => response.text())

.then(data => {

let display = "";

if(stdin.trim() !== ""){
display += "Input:\n"+stdin+"\n\n";
}

display += "Output:\n"+data;

terminal.innerText = display;

});

}

function executeCode(){

const code=editor.getValue();

document.getElementById("output").innerText="Executing test cases...\n";

fetch("/execute/{{ problem[0] }}",{

method:"POST",
headers:{"Content-Type":"application/x-www-form-urlencoded"},

body:
"code="+encodeURIComponent(code)
+"&language="+encodeURIComponent(language)

})
.then(r=>r.text())
.then(d=>document.getElementById("output").innerText=d);

}

function submitCode(){

const code = editor.getValue();

document.getElementById("output").innerText = "Submitting...\n";

fetch("/submit/{{ problem[0] }}",{

method:"POST",
headers:{"Content-Type":"application/x-www-form-urlencoded"},

body:
"code="+encodeURIComponent(code)
+"&language="+encodeURIComponent(language)

})
.then(response=>response.text())

.then(data=>{

const parts = data.split("|");

const verdict = parts[0];
const passed = parts[1];
const total = parts[2];
const nextId = parts[3];

document.getElementById("output").innerText =
verdict+" — "+passed+"/"+total+" Passed";

if(verdict==="Accepted" && nextId && nextId!=="None"){
window.location.href="/problem/"+nextId+"?lang="+language;
}

});

}

</script>

</body>
</html>
