<!DOCTYPE html>
<html>
<head>

<title>All Submissions</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#0f172a;
color:white;
padding:40px;
font-family:Arial;
}

table{
background:#1e293b;
}

</style>

</head>

<body>

<h2>All User Submissions</h2>
<a href="/admin" class="btn btn-secondary mb-3">⬅ Back to Admin</a>

<table class="table table-bordered text-center">

<thead class="table-dark">

<tr>
<th>User</th>
<th>Problem</th>
<th>Language</th>
<th>Verdict</th>
<th>Time</th>
</tr>

</thead>

<tbody>

{% for s in submissions %}

<tr>

<td>{{ s[0] }}</td>
<td>{{ s[1] }}</td>
<td>{{ s[2] }}</td>
<td>{{ s[3] }}</td>
<td>{{ s[4] }}</td>

</tr>

{% endfor %}

</tbody>

</table>

</body>
</html>
