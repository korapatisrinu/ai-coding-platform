<!DOCTYPE html>
<html>
<head>

<title>Practice Problems</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#0f172a;
color:white;
font-family:Segoe UI;
}

.problem-item{
background:#1f2937;
border:1px solid #2d3748;
padding:14px 18px;
border-radius:8px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
text-decoration:none;
color:white;
}

.problem-item:hover{
background:#2563EB;
}

</style>

</head>

<body>

<div class="container mt-5">

<h3 class="mb-4">Practice Problems</h3>

{% for p in problems %}

<a href="/problem/{{p[0]}}" class="problem-item">
<span>{{p[1]}}</span>
<span>→</span>
</a>

{% endfor %}

</div>

</body>
</html>
